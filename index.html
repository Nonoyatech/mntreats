<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Treats - Biryani, Pilau & Fast Food</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        header {
            background: #2d1b0e;
            color: #ffd700;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.5rem;
        }
        header p {
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .menu-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .cart-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .menu-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .menu-card {
            background: #fff8f0;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #ff6b35;
            transition: transform 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .menu-card h3 {
            color: #2d1b0e;
            font-size: 1.3rem;
        }
        .price {
            color: #ff6b35;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .add-btn {
            background: #2d1b0e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .add-btn:hover {
            background: #ff6b35;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .cart-item-details {
            flex: 2;
        }
        .cart-item-qty {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .qty-btn {
            background: #ddd;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .remove-item {
            background: #ff4444;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .total {
            margin: 20px 0;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
            border-top: 2px solid #ddd;
            padding-top: 15px;
        }
        .order-form {
            margin-top: 20px;
        }
        .order-form input, .order-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .order-form button {
            width: 100%;
            background: #ff6b35;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .admin-panel {
            margin-top: 20px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
        }
        .admin-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-input input {
            flex: 1;
            padding: 8px;
        }
        .admin-btn {
            background: #2d1b0e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .delete-item {
            background: #ff4444;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .location-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            font-size: 1rem;
        }
        .location-btn:hover {
            background: #128C7E;
        }
        .address-hint {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }
        .map-link {
            display: inline-block;
            background: #4285F4;
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

    </style>
</head>
<body>
    <header>
        <h1>🍛 M&N Treats</h1>
        <p>Authentic Biryani | Tasty Pilau | Fast Food | Catering Services</p>
    </header>

    <div class="container">
        <div class="menu-section">
            <h2>📋 Our Menu</h2>
            <div id="menuItems" class="menu-items"></div>
            
            <div class="admin-panel">
                <h3>🔧 Admin Controls (Add/Remove Items)</h3>
                <div class="admin-input">
                    <input type="text" id="newItemName" placeholder="Item name (e.g., Chicken Biryani)">
                    <input type="number" id="newItemPrice" placeholder="Price (KES)">
                    <input type="text" id="newItemCategory" placeholder="Category (Biryani/Pilau/Fast Food)">
                    <button class="admin-btn" onclick="addMenuItem()">➕ Add Item</button>
                </div>
            </div>
        </div>

        <div class="cart-section">
            <h2>🛒 Your Cart</h2>
            <div id="cartItems"></div>
            <div id="cartTotal" class="total">Total: KES 0</div>
            
            <div class="order-form">
                <h3>📝 Delivery & Booking Details</h3>
                <input type="text" id="customerName" placeholder="Your Full Name" required>
                <input type="tel" id="customerPhone" placeholder="Phone Number (for order confirmation)" required>
<textarea id="deliveryAddress" rows="3" placeholder="Delivery Address (Street, Estate, Building Name, House Number)" required></textarea>
<button type="button" class="location-btn" onclick="shareLiveLocation()">
    📍 Share My Live Location (WhatsApp/Google Maps)
</button>
<button type="button" class="location-btn" onclick="openGoogleMaps()">
    🗺️ Open Google Maps to Copy Address
</button>
<div id="locationStatus" class="address-hint"></div>
<input type="text" id="landmark" placeholder="Nearby Landmark (Optional - e.g., near Kenol Petrol Station)">
                <input type="text" id="bookingService" placeholder="Book a service (e.g., Catering, Event Booking)">
                
                <div id="statusMsg" class="status"></div>
                <button onclick="submitOrder()">📞 Place Order (Pay on Delivery / Manual M-Pesa)</button>
            </div>
            <p style="font-size: 0.8rem; margin-top: 10px; color: #666;">
                * You'll be contacted via phone to complete M-Pesa payment
            </p>
        </div>
    </div>

    <script>
        // Default menu items
        let menuItems = [
            { id: 1, name: "Chicken Biryani", price: 450, category: "Biryani" },
            { id: 2, name: "Beef Biryani", price: 500, category: "Biryani" },
            { id: 3, name: "Chicken Pilau", price: 350, category: "Pilau" },
            { id: 4, name: "Beef Pilau", price: 400, category: "Pilau" },
            { id: 5, name: "French Fries", price: 150, category: "Fast Food" },
            { id: 6, name: "Burger", price: 250, category: "Fast Food" },
            { id: 7, name: "Samosa (3pcs)", price: 100, category: "Fast Food" },
            { id: 8, name: "Soda", price: 70, category: "Drinks" }
        ];

        let cart = [];
        let nextId = 9;

        // Load data from localStorage
        function loadData() {
            const savedMenu = localStorage.getItem('mnTreats_menu');
            if (savedMenu) {
                menuItems = JSON.parse(savedMenu);
                nextId = Math.max(...menuItems.map(i => i.id), 0) + 1;
            }
            
            const savedCart = localStorage.getItem('mnTreats_cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            
            renderMenu();
            renderCart();
        }

        // Save menu to localStorage
        function saveMenu() {
            localStorage.setItem('mnTreats_menu', JSON.stringify(menuItems));
        }

        // Save cart to localStorage
        function saveCart() {
            localStorage.setItem('mnTreats_cart', JSON.stringify(cart));
            renderCart();
        }

        // Add item to cart
        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            const existing = cart.find(c => c.id === itemId);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...item, quantity: 1 });
            }
            
            saveCart();
            showStatus(`${item.name} added to cart!`, 'success');
        }

        // Share live location via WhatsApp
function shareLiveLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                const whatsappLink = `https://wa.me/?text=My%20delivery%20location:%20${mapsLink}`;
                
                document.getElementById('locationStatus').innerHTML = `
                    ✅ Location captured! 
                    <a href="${mapsLink}" target="_blank" class="map-link">View on Map</a>
                    <a href="${whatsappLink}" target="_blank" class="map-link">Send via WhatsApp</a>
                `;
                
                // Store coordinates
                window.customerLat = lat;
                window.customerLng = lng;
            },
            function(error) {
                document.getElementById('locationStatus').innerHTML = '⚠️ Please enable location services or type address manually';
            }
        );
    } else {
        document.getElementById('locationStatus').innerHTML = '⚠️ Browser doesn\'t support location. Please type address.';
    }
}

// Open Google Maps for customer to find & copy address
function openGoogleMaps() {
    window.open('https://www.google.com/maps', '_blank');
    document.getElementById('locationStatus').innerHTML = '📍 Open Google Maps → Search your location → Click on the address → Copy and paste above';
}

// Modified submitOrder function with better address collection
function submitOrder() {
    const customerName = document.getElementById('customerName').value.trim();
    const customerPhone = document.getElementById('customerPhone').value.trim();
    let deliveryAddress = document.getElementById('deliveryAddress').value.trim();
    const landmark = document.getElementById('landmark').value.trim();
    const bookingService = document.getElementById('bookingService').value.trim();
    
    // Add landmark to address if provided
    if (landmark) {
        deliveryAddress += ` (Near: ${landmark})`;
    }
    
    // Add GPS coordinates if captured
    if (window.customerLat && window.customerLng) {
        deliveryAddress += `\n📍 GPS: https://maps.google.com?q=${window.customerLat},${window.customerLng}`;
    }
    
    if (!customerName || !customerPhone || !deliveryAddress) {
        showStatus('Please fill Name, Phone, and Delivery Address', 'error');
        return;
    }
    
    if (cart.length === 0) {
        showStatus('Your cart is empty! Add some items first.', 'error');
        return;
    }
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    const order = {
        orderId: 'MN' + Date.now(),
        customer: { 
            name: customerName, 
            phone: customerPhone, 
            address: deliveryAddress,
            landmark: landmark || 'None'
        },
        items: cart.map(i => ({ name: i.name, quantity: i.quantity, price: i.price, subtotal: i.price * i.quantity })),
        total: total,
        bookingRequest: bookingService || 'None',
        timestamp: new Date().toLocaleString('en-KE', { timeZone: 'Africa/Nairobi' }),
        paymentStatus: 'Pending - Call customer for M-Pesa',
        riderNotes: `📞 Call customer before delivery\n🚗 Ask for exact building/floor number`
    };
    
    // Save order
    const orders = JSON.parse(localStorage.getItem('mnTreats_orders') || '[]');
    orders.push(order);
    localStorage.setItem('mnTreats_orders', JSON.stringify(orders));
    
    // Send to Telegram
    sendOrderToTelegram(order);
    
    // Clear cart and form
    cart = [];
    saveCart();
    document.getElementById('customerName').value = '';
    document.getElementById('customerPhone').value = '';
    document.getElementById('deliveryAddress').value = '';
    document.getElementById('landmark').value = '';
    document.getElementById('bookingService').value = '';
    window.customerLat = null;
    window.customerLng = null;
    document.getElementById('locationStatus').innerHTML = '';
    
    showStatus(`✅ Order #${order.orderId} placed! Total: KES ${total}\nWe'll call you on ${customerPhone} to confirm delivery address & payment.`, 'success');
    
    // Show full order details for admin
    console.log('📦 NEW ORDER DETAILS:', order);
    alert(`🧾 ORDER CONFIRMATION\n\nOrder ID: ${order.orderId}\nCustomer: ${customerName}\nPhone: ${customerPhone}\nTotal: KES ${total}\n\n📍 DELIVERY ADDRESS:\n${deliveryAddress}\n\nWe will call you within 5 minutes to confirm.`);
}

// Updated Telegram notification with full address
function sendOrderToTelegram(order) {
    const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';  // REPLACE WITH YOUR TOKEN
    const CHAT_ID = 'YOUR_CHAT_ID_HERE';      // REPLACE WITH YOUR CHAT ID
    
    if (BOT_TOKEN === 'YOUR_BOT_TOKEN_HERE') {
        console.log('⚠️ Telegram not configured. Set BOT_TOKEN and CHAT_ID');
        console.log('📦 Order saved locally. Run viewOrders() to see it.');
        return;
    }
    
    const message = `
🍛🍔 M&N TREATS - NEW ORDER 🍕🍟
━━━━━━━━━━━━━━━━━━━━━━━━
🆔 ORDER ID: ${order.orderId}
⏰ TIME: ${order.timestamp}
━━━━━━━━━━━━━━━━━━━━━━━━
👤 CUSTOMER:
  Name: ${order.customer.name}
  Phone: ${order.customer.phone}
━━━━━━━━━━━━━━━━━━━━━━━━
📍 DELIVERY ADDRESS:
${order.customer.address}
━━━━━━━━━━━━━━━━━━━━━━━━
📦 ORDER ITEMS:
${order.items.map(i => `  • ${i.name} x${i.quantity} = KES ${i.subtotal}`).join('\n')}
━━━━━━━━━━━━━━━━━━━━━━━━
💰 TOTAL: KES ${order.total}
🎂 BOOKING: ${order.bookingRequest}
━━━━━━━━━━━━━━━━━━━━━━━━
📌 INSTRUCTIONS:
  1. Call customer on ${order.customer.phone}
  2. Confirm exact delivery location
  3. Ask for M-Pesa payment
  4. Share live location with rider
━━━━━━━━━━━━━━━━━━━━━━━━
✅ ACTION: Call customer NOW
    `;
    
    // Send to Telegram
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            chat_id: CHAT_ID, 
            text: message,
            parse_mode: 'HTML'
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {

        // Update cart item quantity
        function updateQuantity(itemId, delta) {
            const item = cart.find(c => c.id === itemId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(c => c.id !== itemId);
                }
                saveCart();
            }
        }

        // Remove item from cart
        function removeCartItem(itemId) {
            cart = cart.filter(c => c.id !== itemId);
            saveCart();
        }

        // Render menu
        function renderMenu() {
            const container = document.getElementById('menuItems');
            container.innerHTML = menuItems.map(item => `
                <div class="menu-card">
                    <h3>${item.name}</h3>
                    <p style="color: #666; font-size: 0.85rem;">${item.category}</p>
                    <div class="price">KES ${item.price}</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">Add to Cart</button>
                    <button class="delete-item" onclick="deleteMenuItem(${item.id})">🗑 Remove</button>
                </div>
            `).join('');
        }

        // Render cart
        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #999;">Your cart is empty</p>';
                document.getElementById('cartTotal').innerHTML = 'Total: KES 0';
                return;
            }
            
            cartContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <strong>${item.name}</strong><br>
                        KES ${item.price} each
                    </div>
                    <div class="cart-item-qty">
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button class="remove-item" onclick="removeCartItem(${item.id})">✖</button>
                    </div>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cartTotal').innerHTML = `Total: KES ${total}`;
        }

        // Admin: Add menu item
        function addMenuItem() {
            const name = document.getElementById('newItemName').value.trim();
            const price = parseFloat(document.getElementById('newItemPrice').value);
            const category = document.getElementById('newItemCategory').value.trim();
            
            if (!name || isNaN(price) || !category) {
                showStatus('Please fill all fields', 'error');
                return;
            }
            
            const newItem = {
                id: nextId++,
                name: name,
                price: price,
                category: category
            };
            
            menuItems.push(newItem);
            saveMenu();
            renderMenu();
            
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            document.getElementById('newItemCategory').value = '';
            showStatus(`"${name}" added to menu!`, 'success');
        }

        // Admin: Delete menu item
        function deleteMenuItem(id) {
            if (confirm('Remove this item from menu?')) {
                menuItems = menuItems.filter(i => i.id !== id);
                saveMenu();
                renderMenu();
                showStatus('Item removed from menu', 'success');
            }
        }

        // Show status message
        function showStatus(msg, type) {
            const statusDiv = document.getElementById('statusMsg');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = msg;
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 3000);
        }

        // Submit order
        function submitOrder() {
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
            const bookingService = document.getElementById('bookingService').value.trim();
            
            if (!customerName || !customerPhone || !deliveryAddress) {
                showStatus('Please fill all required fields (Name, Phone, Address)', 'error');
                return;
            }
            
            if (cart.length === 0) {
                showStatus('Your cart is empty! Add some items first.', 'error');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const order = {
                orderId: 'MN' + Date.now(),
                customer: { name: customerName, phone: customerPhone, address: deliveryAddress },
                items: cart.map(i => ({ name: i.name, quantity: i.quantity, price: i.price, subtotal: i.price * i.quantity })),
                total: total,
                bookingRequest: bookingService || 'None',
                timestamp: new Date().toLocaleString('en-KE', { timeZone: 'Africa/Nairobi' }),
                paymentStatus: 'Pending (Customer to be called for M-Pesa)'
            };
            
            // Save to localStorage for admin view
            const orders = JSON.parse(localStorage.getItem('mnTreats_orders') || '[]');
            orders.push(order);
            localStorage.setItem('mnTreats_orders', JSON.stringify(orders));
            
            // Send to admin via Telegram (FREE - Need to set up bot)
            sendOrderToTelegram(order);
            
            // Clear cart
            cart = [];
            saveCart();
            
            // Clear form
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('deliveryAddress').value = '';
            document.getElementById('bookingService').value = '';
            
            showStatus(`✅ Order placed! Order ID: ${order.orderId}\nYou'll receive a call on ${customerPhone} to complete M-Pesa payment of KES ${total}`, 'success');
            
            // Also show order summary in console for admin
            console.log('📦 NEW ORDER:', order);
            alert(`Order placed!\nOrder ID: ${order.orderId}\nTotal: KES ${total}\n\nWe will call you on ${customerPhone} to confirm payment & delivery.`);
        }
